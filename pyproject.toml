[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-aware-active-suspension"
version = "0.1.0"
description = "Risk-aware active suspension control experiments with super-twisting normal-load estimation."
readme = "experiment_plan.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "cvxpy>=1.4",
    "osqp>=0.6",
    "matplotlib>=3.8",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "dataclasses; python_version<'3.7'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
